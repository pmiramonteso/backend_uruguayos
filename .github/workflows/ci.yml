name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Instalar y arrancar contra MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: proj_uruguayos
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: development
      PORT: 3000
      HOST_NAME: 127.0.0.1
      DATABASE: proj_uruguayos
      USER_NAME: root
      PASSWORD: root
      JWT_SECRET: ci-secret
      BCRYPT_SALT: 4
      # Base de datos vacía: que el servidor cree las tablas al arrancar
      DB_SYNC: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Comprobar sintaxis
        run: find src -name '*.js' -not -path 'src/uploads/*' -print0 | xargs -0 -n1 node --check

      - name: Arrancar el servidor
        run: |
          node src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q 'Tablas creadas' server.log && break
            grep -q 'Unable to connect' server.log && { cat server.log; exit 1; }
            sleep 1
          done
          grep -q 'Tablas creadas' server.log || { cat server.log; exit 1; }

      - name: Probar la API
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1")
            echo "$1 -> $code (esperado $2)"
            [ "$code" = "$2" ]
          }
          check /api/eventos 200
          check /api/negocios 200
          check /api/posts 200
          check /api/graficos 200
          check /api/eventos/abc 400
          check /api/eventos/999999 404

      - name: Log del servidor
        if: always()
        run: cat server.log
